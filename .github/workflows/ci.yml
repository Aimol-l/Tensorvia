name: CI

# 只跑得到的 lane：GitHub 托管 runner 没有 GPU，设备后端（Vulkan/CUDA/SYCL）
# 的测试套件需要真实设备，留到本地按 README 的四条 lane 命令验证。这里守的是
# CPU 的**两条**构建路径——CMake 那条曾经因为源文件清单漏了 src/core/dtype.cpp
# 而悄悄断了很久，正是这个 job 存在的理由。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  cmake:
    name: CMake (CPU, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libgtest-dev libomp-dev

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DBACKEND_CPU=ON
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cmake-clang:
    name: CMake (CPU, Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build libgtest-dev libomp-dev

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DBACKEND_CPU=ON
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
